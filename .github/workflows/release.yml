name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGISTRY: ghcr.io
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout annotated tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and prepare release metadata
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "Release tags must be annotated tags: $tag" >&2
            exit 1
          fi
          git for-each-ref --format='%(contents)' "refs/tags/$tag" > "$RUNNER_TEMP/tag-body.md"
          if ! grep --quiet '[^[:space:]]' "$RUNNER_TEMP/tag-body.md"; then
            echo "Annotated tag body must not be empty" >&2
            exit 1
          fi
          if ! grep --quiet --fixed-strings "Release $tag   " "$RUNNER_TEMP/tag-body.md" \
            || ! grep --quiet '^## 1、新增功能：' "$RUNNER_TEMP/tag-body.md" \
            || ! grep --quiet '^## 2、优化改进：' "$RUNNER_TEMP/tag-body.md" \
            || ! grep --quiet '^## 3、Bug 修复：' "$RUNNER_TEMP/tag-body.md"; then
            echo "Annotated tag body does not follow the required release-note structure" >&2
            exit 1
          fi
          repository_lower="${GITHUB_REPOSITORY,,}"
          image="$REGISTRY/$repository_lower"
          if [[ "$tag" == *-* ]]; then
            prerelease=true
            image_tags="$image:$tag"
          else
            prerelease=false
            image_tags="$image:$tag"$'\n'"$image:latest"
          fi
          {
            cat <<'INTRO'
          Yuque Backup 是面向单管理员、自托管场景的语雀只读备份系统，提供多凭据管理、定时增量备份、本地版本、附件保存、安全预览和任务审计。

          ## Version Notes

          INTRO
            cat "$RUNNER_TEMP/tag-body.md"
            cat <<EOF

          ## Installation

          使用仓库中的 Docker Compose 配置启动，镜像为 \`$image:$tag\`。完整步骤见 [Docker 快速运行项目](https://github.com/$GITHUB_REPOSITORY/blob/$tag/Docker%E5%BF%AB%E9%80%9F%E8%BF%90%E8%A1%8C%E9%A1%B9%E7%9B%AE.md)。

          ## Documentation

          - [需求文档](https://github.com/$GITHUB_REPOSITORY/blob/$tag/%E9%9C%80%E6%B1%82%E6%96%87%E6%A1%A3.md)
          - [技术方案文档](https://github.com/$GITHUB_REPOSITORY/blob/$tag/%E6%8A%80%E6%9C%AF%E6%96%B9%E6%A1%88%E6%96%87%E6%A1%A3.md)
          - [API 接口文档](https://github.com/$GITHUB_REPOSITORY/blob/$tag/API%20%E6%8E%A5%E5%8F%A3%E6%96%87%E6%A1%A3.md)
          EOF
          } > "$RUNNER_TEMP/release-notes.md"
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "image=$image"
            echo "image_tags<<EOF"
            echo "$image_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image_tags }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            REVISION=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}

      - name: Create GitHub prerelease
        if: steps.tag.outputs.prerelease == 'true'
        run: >-
          gh release create "${{ steps.tag.outputs.tag }}"
          --verify-tag
          --title "${{ steps.tag.outputs.tag }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --prerelease

      - name: Create GitHub release and update latest
        if: steps.tag.outputs.prerelease == 'false'
        run: >-
          gh release create "${{ steps.tag.outputs.tag }}"
          --verify-tag
          --title "${{ steps.tag.outputs.tag }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --latest
