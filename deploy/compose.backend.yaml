name: yuque-backup-backend

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  image: yuque-backup-backend:1.1.0
  environment: &backend-environment
    APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
    APP_ENV: ${APP_ENV:-development}
    DATA_ROOT: /data
    DATABASE_URL: sqlite:////data/db/yuque-backup.sqlite3
    TZ: ${TZ:-Asia/Shanghai}
    SECURE_COOKIES: ${SECURE_COOKIES:-false}
    TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
  user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
  init: true
  restart: unless-stopped

services:
  migrate:
    <<: *backend
    command: ["yuque-backup-migrate"]
    restart: "no"
    volumes:
      - ../data/db:/data/db

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../data/db:/data/db
      - ../data/content:/data/content:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../data/db:/data/db
      - ../data/content:/data/content
