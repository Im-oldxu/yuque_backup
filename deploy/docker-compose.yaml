name: yuque-backup

x-application: &application
  image: ${YUQUE_BACKUP_IMAGE:-ghcr.io/im-oldxu/yuque_backup:latest}
  environment: &application-environment
    APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
    APP_ENV: ${APP_ENV:-development}
    DATA_ROOT: /data
    DATABASE_URL: sqlite:////data/db/yuque-backup.sqlite3
    HOST: 0.0.0.0
    PORT: 8000
    TZ: ${TZ:-Asia/Shanghai}
    SECURE_COOKIES: ${SECURE_COOKIES:-false}
    TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
  user: "10001:10001"
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  migrate:
    <<: *application
    command: ["migrate"]
    restart: "no"
    volumes:
      - database:/data/db

  api:
    <<: *application
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - database:/data/db
      - content:/data/content:ro
    healthcheck:
      test: ["CMD", "yuque-backup", "healthcheck", "api"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *application
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - database:/data/db
      - content:/data/content
    healthcheck:
      test: ["CMD", "yuque-backup", "healthcheck", "worker"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 45s
    stop_grace_period: 2m

volumes:
  database:
    name: yuque-backup-database
  content:
    name: yuque-backup-content
